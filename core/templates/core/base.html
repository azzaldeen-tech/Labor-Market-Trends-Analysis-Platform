<!DOCTYPE html>
{% load static %}
{% load i18n %}
{% get_current_language as LANGUAGE_CODE %}
{% load static tailwind_tags %}
{% tailwind_css %}

<html lang="{{ LANGUAGE_CODE }}" dir="{% if LANGUAGE_CODE == 'ar' %}rtl{% else %}ltr{% endif %}">
<head>
    <title>{% block title %}مشروعي{% endblock %}</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
<!--    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />-->

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>

            /* أضف هذا الكلاس واستخدمه مع أرقام الإحصائيات */
        .force-latin-numbers {
            font-variant-numeric: lining-nums tabular-nums;
            font-feature-settings: "lnum", "tnum";
            /* في بعض الخطوط العربية نحتاج لتعطيل السمات المحلية للأرقام */
            font-variant-ligatures: no-common-ligatures;
        }
         /* تنسيق شريط التمرير للقائمة الجانبية */
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px; /* عرض نحيف جداً لعدم مضايقة الروابط */
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent; /* خلفية شفافة ليبقى متناسقاً مع لون السايدبار */
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.05); /* لون رمادي خفيف جداً في الحالة العادية */
            border-radius: 10px;
            transition: background 0.3s ease;
        }

        /* يظهر اللون بوضوح أكبر عند تمرير الفأرة فوق القائمة */
        .custom-scrollbar:hover::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.15);
        }

        /* لدعم متصفح فايرفوكس */
        .custom-scrollbar {
            scrollbar-width: thin;
            scrollbar-color: rgba(0, 0, 0, 0.1) transparent;
        }
    </style>


<!--     <script src="https://cdn.tailwindcss.com"></script>-->
    <!-- مكتبة المخططات البيانية Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="{% static 'js/htmx.min.js' %}"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
<!--    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>-->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<!--    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>-->

</head>

<body  class="bg-base  transition-colors duration-300  font-sans antialiased h-screen overflow-auto">

    {% include 'core/includes/navbar.html' %}


    <div class="w-full">
        {% block content %}
        {% endblock %}
    </div>


    {% include 'core/includes/footer.html' %}

<!--       // 1. الدالة المركزية لتطبيق الثيم-->
<!--    <script src="{% static 'js/app.js' %}"></script>-->
<script>
    // 1. مصفوفة الثيمات المتاحة
    const themes = ['light', 'dark'];//, 'emerald'];

    // 2. دالة التطبيق (الوحيدة المسؤولة عن الشكل)
    const applyTheme = (theme) => {
        document.documentElement.setAttribute('data-theme', theme);
        // إضافة كلاس dark فقط إذا كان الثيم هو dark لضمان عمل كلاسات dark: في تايلوند
        document.documentElement.classList.toggle('dark', theme === 'dark');
        localStorage.setItem('theme', theme);
    };

    // 3. دالة التبديل (الدوران بين الثيمات)
    async function toggleTheme() {
        const current = localStorage.getItem('theme') || 'light';
        const currentIndex = themes.indexOf(current);
        // اختيار الثيم التالي في المصفوفة (والموؤشر يعود للصفر بعد الأخير)
        const nextTheme = themes[(currentIndex + 1) % themes.length];

        applyTheme(nextTheme);

        // المزامنة مع السيرفر
        if ("{{ user.is_authenticated }}" === "True") {
            fetch('{% url "core:toggle_theme" %}', {
                method: 'POST',
                headers: {'X-CSRFToken': '{{ csrf_token }}', 'Content-Type': 'application/json'},
                body: JSON.stringify({ 'theme': nextTheme })
            });
        }
    }

    // 4. التشغيل الفوري عند التحميل
    const initialTheme = "{{ request.session.theme }}" || localStorage.getItem('theme') || 'light';
    applyTheme(initialTheme === 'None' ? 'light' : initialTheme);
</script>
<script>
  lucide.createIcons();
</script>

</body>
</html>
