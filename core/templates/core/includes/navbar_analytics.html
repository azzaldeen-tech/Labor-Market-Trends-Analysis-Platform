    <header class="glass-card sticky top-0 z-50 shadow-lg bg-white/80 backdrop-blur-md">
        <div class="container mx-auto px-4 py-4">
            <div class="flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <div class="bg-gradient-to-r from-blue-600 to-purple-600 p-2 rounded-lg">
                        <i data-lucide="trending-up" class="w-8 h-8 text-white"></i>
                    </div>
                    <span class="font-bold text-xl gradient-text">مرصد اتجاهات سوق العمل</span>
                </div>
                <div class="flex items-center gap-4">
                <a href="{% url 'core:student_guidance_analytics' %}"
                   class=" text-gray-700  btn flex dark:text-gray-200 hover:text-blue-600 text-[15px]   dark:hover:text-blue-400 text-[15px]l">
<!--                     <i data-lucide="trending-up" class="w-6 h-6 mx-3 text-[5px] "></i>-->
                    {% trans 'التخصصات الأكثر طلباً خلال السنوات القادمة' %}
                </a>
                <a href="{% url 'core:predictive_analytics' %}"
                   class=" text-gray-700 flex btn dark:text-gray-200 hover:text-blue-600 text-[15px] dark:hover:text-blue-400 text-[15px]l">
<!--                     <i data-lucide="trending-up" class="w-6 h-6 mx-3 text-[5px] "></i>-->
                    {% trans 'التنبؤ بحركة نمو الوظائف في الأشهر القادمة' %}
                </a>
                    <button id="reset-filters" onclick="resetFilters()" class="flex items-center gap-2 bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition-colors">
                        <i data-lucide="refresh-cw" class="w-4 h-4"></i>
                        <span class="hidden sm:inline">إعادة ضبط الفلاتر</span>
                    </button>
                    <div class="flex items-center gap-2 text-sm text-gray-600">
                        <i data-lucide="calendar" class="w-4 h-4"></i>
                        <span id="currentDate"></span>
                    </div>
                </div>
            </div>
        </div>
    </header>
    <script>
    // إعدادات التاريخ الحالي بالواجهة
    const dateOptions = { year: 'numeric', month: 'long', day: 'numeric' };
    const currentDateElem = document.getElementById('currentDate');
    if(currentDateElem) {
        currentDateElem.textContent = new Date().toLocaleDateString('ar-SA', dateOptions);
    }

    var reset_filter = document.getElementById('reset-filters');


    if (window.location.pathname.endsWith('/ar/student_guidance_analytics/')) {
        if (reset_filter) {
            reset_filter.style.display = 'none'; // إخفاء الزر تماماً
        }
    }
    else{
     if (reset_filter) {
            reset_filter.style.display = 'flex'; // إخفاء الزر تماماً
        }
    }


    function resetFilters() {

        if(document.getElementById('city-filter')){
            document.getElementById('city-filter').value = '';
            applyFilters();
         }
        if(document.getElementById('category-filter')){
            document.getElementById('category-filter').value = '';
            applyFilters();
        }
        if(document.getElementById('year-filter')){
               document.getElementById('year-filter').value = '';
               applyFilters();
        }

    }
    </script>
