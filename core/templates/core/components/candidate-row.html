{% if redirect_link %}<a href="{{ redirect_link }}" class="block">{% endif %}
    <div class="candidate-row flex items-center gap-3 py-3 rounded-xl px-2 cursor-pointer transition-colors hover:bg-surface-card {% if not is_last %}border-b border-stroke-soft{% endif %}"
                 onclick="showToast('فتح ملف {{ c.name }}', 'info')">

           <div class="w-9 h-9 shrink-0">
            {% if "." in c.avatar %}
                <img src="{{ c.avatar }}"
                     alt="{{ c.name }}"
                     class="w-9 h-9 rounded-full object-cover border border-stroke-soft shadow-sm"
                     onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">

                <div class="hidden w-9 h-9 rounded-full items-center justify-center text-white text-[11px] font-bold shadow-sm"
                     style="background-color: {{ c.color|default:'#0d7c5f' }};">
                    {{ c.name|slice:":1" }}
                </div>
            {% else %}
                <div class="w-9 h-9 rounded-full flex items-center justify-center text-white text-[11px] font-bold shadow-sm"
                     style="background-color: {{ c.color|default:'#0d7c5f' }}">
                   {{ c.name|slice:":1" }}
                </div>
            {% endif %}
        </div>

        <div class="flex-1 min-w-0">
            <div class="text-[13px] font-semibold text-content truncate">{{ c.name }}</div>
            <div class="text-[11px] text-content-muted">{{ c.role }}</div>
        </div>

        <div class="text-left shrink-0">
            <div class="text-[12px] font-display font-bold text-brand">{{ c.match }}%</div>
            <div class="text-[9px] text-content-muted">تطابق</div>
        </div>

        <div class="text-[10px] text-content-muted whitespace-nowrap hidden sm:block">
            {{ c.time }}
        </div>
    </div>
{% if redirect_link %}</a>{% endif %}
